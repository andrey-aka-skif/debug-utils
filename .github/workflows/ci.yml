# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: CI

# push по всем веткам, без pull_request: PR внутри этого же репозитория иначе
# прогонялись бы дважды на одном и том же коммите.
on:
  push:
    branches: ['**']

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x, 24.x]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      # На публикации ту же проверку тянет хук prepublishOnly из манифеста,
      # но npm publish в CI не выполняется — здесь нужен явный шаг.
      - name: Package lint
        run: npm run lint:publish

      - name: Test
        run: npm test
