name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x, 24.x]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # На публикации ту же проверку тянет хук prepublishOnly, но npm publish
      # в CI не выполняется — здесь нужен явный шаг. Ветки и PR всегда идут по
      # своему снапшоту, так что жёсткая ссылка на скрипт тут безопасна.
      - name: Package lint
        run: npm run lint:publish

      - name: Test
        run: npm test
